[project]
name = "ingredient-intelligence-api"
version = "0.1.0"
description = "Explainable ingredient analysis API"
# The native dependencies used by the local API/test runtime are verified on
# these Python versions.  Python 3.14 currently loaded an incompatible cached
# pydantic-core binary on this machine, so keep the supported range explicit.
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
